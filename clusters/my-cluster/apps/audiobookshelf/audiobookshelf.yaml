apiVersion: v1
kind: Namespace
metadata:
  name: audiobookshelf
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-audiobooks
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  mountOptions:
    - nfsvers=4.1
    - rsize=1048576
    - wsize=1048576
    - hard
    - timeo=600
    - retrans=2
    - noatime
    - nodiratime
    - async
  nfs:
    server: "192.168.200.184"
    path: "/volume1/media/audiobooks"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: audiobookshelf-audiobooks
    namespace: audiobookshelf
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-audiobooks
  namespace: audiobookshelf
  labels:
    app: audiobookshelf
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: ""
  volumeName: audiobookshelf-audiobooks
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app: audiobookshelf
  annotations:
    volume.longhorn.io/replica-count: "2"
spec:
  storageClassName: longhorn-talos
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app: audiobookshelf
spec:
  selector:
    app: audiobookshelf
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  hostnames:
    - audiobookshelf.lab.jake-watson.co.uk
    - abs.lab.jake-watson.co.uk
  parentRefs:
    - name: cilium-gateway-external
      namespace: default
  rules:
    # Download/upload paths — long timeout to support large audiobook/podcast file transfers
    - matches:
        - path:
            type: PathPrefix
            value: /api/items
        - path:
            type: PathPrefix
            value: /api/podcasts
        - path:
            type: PathPrefix
            value: /api/upload
      timeouts:
        request: 0s # no ceiling on slow-client upload body transmission
        backendRequest: 600s # 10 minutes: covers even large audiobook uploads/downloads on slow links
      backendRefs:
        - kind: Service
          name: audiobookshelf
          port: 80
    # All other traffic — standard timeout
    - timeouts:
        backendRequest: 60s
      backendRefs:
        - kind: Service
          name: audiobookshelf
          port: 80
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: audiobookshelf-dns
  namespace: audiobookshelf
spec:
  endpoints:
    - dnsName: abs.lab.jake-watson.co.uk
      recordTTL: 180
      recordType: A
      targets:
        - 212.69.47.125
