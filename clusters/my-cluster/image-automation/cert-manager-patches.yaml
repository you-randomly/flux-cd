# Patch-level Helm updates (docs: https://fluxoperator.dev/docs/resourcesets/image-automation/)
# The provider tracks the newest v1.21.x chart in OCI; the ResourceSet renders
# an OCIRepository + HelmRelease pinned to that tag. Minor/major bumps stay manual:
# change the semver range below.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: cert-manager-chart
  namespace: cert-manager
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
spec:
  type: OCIArtifactTag
  url: oci://quay.io/jetstack/charts/cert-manager
  filter:
    includeTag: "^v"
    semver: "~1.21.0"
    limit: 1
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cert-manager-controller
  namespace: cert-manager
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: cert-manager-chart
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: cert-manager-controller
        namespace: cert-manager
      spec:
        interval: 1h
        url: oci://quay.io/jetstack/charts/cert-manager
        ref:
          tag: << inputs.tag >>
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: cert-manager-controller
        namespace: cert-manager
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
      spec:
        interval: 1h
        chartRef:
          kind: OCIRepository
          name: cert-manager-controller
        install:
          crds: CreateReplace
          remediation:
            retries: 3
        upgrade:
          crds: CreateReplace
          remediation:
            retries: 3
        values:
          installCRDs: true
