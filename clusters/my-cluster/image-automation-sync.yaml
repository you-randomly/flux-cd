apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./clusters/my-cluster/image-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
